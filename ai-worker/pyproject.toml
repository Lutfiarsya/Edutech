[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "edutech-ai-worker"
version = "0.1.0"
description = "Asynchronous AI jobs for the Edutech MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.5,<6.0",
    "fastapi>=0.116,<1.0",
    "openai>=2.0,<3.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "redis>=5.2,<7.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9.0",
    "pytest-cov>=6.2,<8.0",
    "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.coverage.run]
source = ["ai_worker"]

[tool.coverage.report]
show_missing = true
skip_covered = true
